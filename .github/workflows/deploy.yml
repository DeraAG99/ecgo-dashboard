name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test with coverage
        run: bunx vitest run --coverage

      - name: Build
        run: bun run build

      - name: Validate docker-compose (baca .env.prod)
        run: |
          cp .env.example .env.prod
          docker compose -f docker-compose.yml --env-file .env.prod config --quiet

  deploy:
    name: Deploy to VM
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_DIR: ${{ vars.APP_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: APP_DIR,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,DATABASE_URL
          script: |
            set -e
            cd "${APP_DIR:-/opt/ecgo-dashboard}"
            git pull origin main
            cat > .env.prod <<EOF
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=${POSTGRES_DB}
            DATABASE_URL=${DATABASE_URL}
            EOF
            docker compose -f docker-compose.yml --env-file .env.prod pull
            docker compose -f docker-compose.yml --env-file .env.prod up -d --build
            docker image prune -f
            echo "Deploy selesai."
        env:
          APP_DIR: ${{ vars.APP_DIR }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
