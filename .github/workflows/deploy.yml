name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test with coverage
        run: bunx vitest run --coverage

      - name: Build
        run: bun run build

      - name: Validate docker-compose
        run: docker compose -f docker-compose.yml --env-file .env.example config --quiet

  deploy:
    name: Deploy to VM
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_DIR: ${{ vars.APP_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via Cloudflare Tunnel
        uses: and-fm/cloudflared-ssh-action@v3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          private_key_value: ${{ secrets.SSH_PRIVATE_KEY }}
          private_key_filename: ${{ secrets.SSH_PRIVATE_KEY_FILENAME }} 
          port: ${{ secrets.SSH_PORT }}
          commands: |
            set -e
            cd "${APP_DIR:-/opt/ecgo-dashboard}"
            git pull origin main
            docker compose --env-file .env.prod pull
            docker compose --env-file .env.prod up -d --build
            docker image prune -f
            echo "✅ Deploy selesai!"