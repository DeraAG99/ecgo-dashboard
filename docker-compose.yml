version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: ecgo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di file .env}
      POSTGRES_DB: ${POSTGRES_DB:-ecgo_dashboard}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  dashboard:
    build: .
    container_name: ecgo-dashboard
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Isi DATABASE_URL di file .env (contoh: postgresql://postgres:PASSWORD@postgres:5432/ecgo_dashboard)}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data: